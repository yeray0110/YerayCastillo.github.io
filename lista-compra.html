<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A shared shopping list with separate Ocado and Breaks ingredients.">
  <title>Shopping list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lista-compra.css">
</head>
<body>
  <main class="shopping-app">
    <header class="app-header">
      <a class="back-link" href="index.html" aria-label="Back to the home page">← Back</a>
      <div class="header-copy">
        <h1>Shopping list</h1>
      </div>
    </header>

    <section class="supplier-tabs" aria-label="Choose shopping list">
      <button class="supplier-tab is-active" type="button" data-provider="breaks">Breaks</button>
      <button class="supplier-tab" type="button" data-provider="ocado">Ocado</button>
    </section>

    <div class="workspace">
      <section class="ingredients-panel" aria-labelledby="ingredients-title">
        <div class="panel-heading">
          <div>
            <p id="provider-kicker" class="section-kicker">BREAKS LIST</p>
            <h2 id="ingredients-title">Ingredients</h2>
          </div>
          <span id="ingredient-count" class="count-pill">0 saved</span>
        </div>

        <form id="add-ingredient-form" class="add-ingredient-form">
          <label class="visually-hidden" for="ingredient-name">Ingredient name</label>
          <input id="ingredient-name" name="ingredient-name" type="text" maxlength="60" placeholder="E.g. Eggs" autocomplete="off" required>
          <label class="visually-hidden" for="ingredient-unit">Unit</label>
          <input id="ingredient-unit" name="ingredient-unit" type="text" maxlength="20" placeholder="Unit (optional)" autocomplete="off">
          <button id="add-button" type="submit">Add to Breaks</button>
        </form>

        <p class="form-help">Use any unit you like: kg, boxes, bottles, packs, or leave it empty.</p>

        <div id="ingredient-list" class="ingredient-list" aria-live="polite"></div>

        <div class="panel-footer">
          <button id="clear-quantities" class="text-button" type="button">Clear quantities only</button>
          <button id="backup-button" class="text-button" type="button">Download backup</button>
          <label class="text-button restore-label" for="restore-input">Restore backup</label>
          <input id="restore-input" type="file" accept="application/json" hidden>
        </div>
      </section>

      <aside class="shopping-panel" aria-labelledby="shopping-title">
        <div class="shopping-heading">
          <div>
            <p id="shopping-kicker" class="section-kicker">SHOPPING FOR BREAKS</p>
            <h2 id="shopping-title">Shopping list</h2>
          </div>
          <button id="copy-list" class="copy-button" type="button" disabled>Copy</button>
        </div>

        <div id="shopping-list" class="shopping-list" aria-live="polite"></div>
        <p id="shopping-summary" class="shopping-summary">Add a quantity to start your list.</p>
      </aside>
    </div>

    <template id="empty-ingredients-template">
      <div class="empty-state">
        <span class="empty-icon" aria-hidden="true">+</span>
        <h3>Add your first ingredient</h3>
        <p>For example: eggs, milk, flour, or tomatoes. It will stay in this supplier list.</p>
      </div>
    </template>

    <template id="empty-shopping-template">
      <div class="empty-shopping">
        <span aria-hidden="true">⌁</span>
        <p>Your shopping list will appear here.</p>
        <small>Only ingredients with a quantity are shown.</small>
      </div>
    </template>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/lista-compra.js"></script>
</body>
</html>
